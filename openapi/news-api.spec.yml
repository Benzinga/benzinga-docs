openapi: 3.0.0
info:
  contact: {}
  description: Bearer token authentication
  title: Newsfeed & Why is it Moving v2
  version: 2.0.0
paths:
  /api/v2.1/news/channels:
    get:
      description: Returns a list of all available news channels that can be used to
        filter news items. Channels can have sub-channels, but they will all be
        listed as their own item.
      operationId: get-channels
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Get available news channels
      tags:
        - Channels
  /api/v2/news:
    get:
      description: This REST API returns structured data for news. For optimal
        performance, limit the scope of the query using parameters such as
        tickers, date, and channels, or use updatedSince for deltas. Page
        offsets are limited from 0 - 100000.
      operationId: get-news
      parameters:
        - description: Specify return format
          in: header
          name: accept
          required: true
          schema:
            type: string
            enum:
              - application/json
              - application/xml
            default: application/json
        - description: Page offset. For optimization, performance and technical reasons,
            page offsets are limited from 0 - 100000. Limit the query results by
            other parameters such as date.
          in: query
          name: page
          schema:
            type: integer
            default: 0
        - description: Number of results returned. Maximum 100.
          in: query
          name: pageSize
          schema:
            type: integer
            maximum: 100
            default: 15
        - description: Specify headline only (headline), headline + teaser (abstract), or
            headline + full body (full) text
          in: query
          name: displayOutput
          schema:
            type: string
            enum:
              - full
              - abstract
              - headline
            default: headline
        - description: "The date to query for news. Shorthand for dateFrom and dateTo if
            they are the same. Format: yyyy-mm-dd"
          in: query
          name: date
          schema:
            type: string
        - description: "Date to query from point in time. Sorted by published date.
            Format: yyyy-mm-dd"
          in: query
          name: dateFrom
          schema:
            type: string
        - description: "Date to query to point in time. Sorted by published date. Format:
            yyyy-mm-dd"
          in: query
          name: dateTo
          schema:
            type: string
        - description: The last updated Unix timestamp (UTC) to pull and sort by
          in: query
          name: updatedSince
          schema:
            type: integer
        - description: The last published Unix timestamp (UTC) to pull and sort by
          in: query
          name: publishedSince
          schema:
            type: integer
        - description: "Allows control of results sorting. Default is created, DESC.
            Format: field:direction. Sort Fields: id, created, updated. Sort
            Order: asc (ascending), desc (descending)"
          in: query
          name: sort
          schema:
            type: string
            enum:
              - id:asc
              - id:desc
              - created:asc
              - created:desc
              - updated:asc
              - updated:desc
        - description: "One or more ISINs separated by a comma. Maximum 50. Format: csv"
          in: query
          name: isin
          schema:
            type: string
        - description: "One or more CUSIPs separated by a comma. Maximum 50. License
            agreement required. Format: csv"
          in: query
          name: cusips
          schema:
            type: string
        - description: "One or more ticker symbols separated by a comma. Maximum 50.
            Format: csv"
          in: query
          name: tickers
          schema:
            type: string
        - description: "One or more primary ticker symbols separated by a comma. Filters
            by primary ticker association only. Format: csv"
          in: query
          name: primaryTickers
          schema:
            type: string
        - description: "One or more channel names or IDs separated by a comma. Format: csv"
          in: query
          name: channels
          schema:
            type: string
        - description: "One or more words/phrases separated by a comma; searches Title,
            Tags, and Body in order of priority. Format: csv"
          in: query
          name: topics
          schema:
            type: string
        - description: Logical operator for topics query. Use 'and' to require all topics,
            'or' to require any topic
          in: query
          name: topic_group_by
          schema:
            type: string
            enum:
              - and
              - or
            default: or
        - description: "One or more authors separated by a comma. Format: csv"
          in: query
          name: authors
          schema:
            type: string
        - description: "One or more content types separated by a comma. Format: csv"
          in: query
          name: content_types
          schema:
            type: string
        - description: Specify the desired format for the api response
          in: query
          name: format
          schema:
            type: string
            enum:
              - text
        - description: Filter by importance level
          in: query
          name: importance
          schema:
            type: string
        - description: Filter by importance rank (1-5)
          in: query
          name: importanceRank
          schema:
            type: integer
        - description: Filter by region (e.g., 'ca' or 'canada' for Canadian content)
          in: query
          name: region
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/api.NewsItem"
                type: array
            text/xml:
              schema:
                items:
                  $ref: "#/components/schemas/api.NewsItem"
                type: array
        "400":
          description: Invalid or Missing Query Parameters
          content:
            application/json:
              schema:
                type: string
            text/xml:
              schema:
                type: string
        "499":
          description: Request Context Cancelled
          content:
            application/json:
              schema:
                type: string
            text/xml:
              schema:
                type: string
        "500":
          description: Internal Error
          content:
            application/json:
              schema:
                type: string
            text/xml:
              schema:
                type: string
      security:
        - ApiKeyAuth: []
      summary: Get the news items
      tags:
        - News
  /api/v2/news-removed:
    get:
      description: Returns the removed news data. Filters the results to only include
        items that have been updated since the specified timestamp.
      operationId: get-removed-news
      parameters:
        - description: Specifies return format
          in: header
          name: accept
          required: true
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        - description: Page offset. For optimization, performance and technical reasons,
            pageSize x page may not exceed 10000. Limit the query results by
            other parameters such as updatedSince.
          in: query
          name: page
          schema:
            type: integer
            default: 0
        - description: Number of results returned. Maximum 1000.
          in: query
          name: pageSize
          schema:
            type: integer
            maximum: 1000
            default: 100
        - description: Filters the results to only include items that have been updated
            since the specified Unix timestamp (UTC)
          in: query
          name: updatedSince
          schema:
            type: integer
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    $ref: "#/components/schemas/api.NewsRemovedItem"
                  type: array
                type: object
        "400":
          description: Invalid or Missing Query Parameters, or pagination beyond the
            maximum offset
          content:
            application/json:
              schema:
                type: string
        "499":
          description: Request Context Cancelled
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Error
          content:
            application/json:
              schema:
                type: string
        "504":
          description: Query Timeout
          content:
            application/json:
              schema:
                type: string
      security:
        - ApiKeyAuth: []
      summary: Returns the removed news data
      tags:
        - News
  "/api/v2/news/{nodeID}":
    get:
      description: |-
        Returns the news item matching the given node ID. The response is
        the same array shape as /api/v2/news, containing a single element.
        An unknown node ID, or one the API key is not entitled to, returns
        200 with an empty array rather than 404.
        Query parameters accepted by /api/v2/news are still applied as
        additional filters, so a filter that excludes the item (for example a
        non-matching tickers or date value) yields an empty array.
      operationId: get-news-by-node-id
      parameters:
        - description: Specify return format
          in: header
          name: accept
          required: true
          schema:
            type: string
            enum:
              - application/json
              - application/xml
            default: application/json
        - description: Node ID of the news item
          in: path
          name: nodeID
          required: true
          schema:
            type: integer
        - description: Specify headline only (headline), headline + teaser (abstract), or
            headline + full body (full) text
          in: query
          name: displayOutput
          schema:
            type: string
            enum:
              - full
              - abstract
              - headline
            default: headline
        - description: Specify the desired format for the api response
          in: query
          name: format
          schema:
            type: string
            enum:
              - text
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/api.NewsItem"
                type: array
            text/xml:
              schema:
                items:
                  $ref: "#/components/schemas/api.NewsItem"
                type: array
        "400":
          description: Invalid or Missing Query Parameters
          content:
            application/json:
              schema:
                type: string
            text/xml:
              schema:
                type: string
        "499":
          description: Request Context Cancelled
          content:
            application/json:
              schema:
                type: string
            text/xml:
              schema:
                type: string
        "500":
          description: Internal Error
          content:
            application/json:
              schema:
                type: string
            text/xml:
              schema:
                type: string
      security:
        - ApiKeyAuth: []
      summary: Returns a single news item by node ID
      tags:
        - News
components:
  securitySchemes:
    ApiKeyAuth:
      description: API key authentication. Provide your API key as a query parameter.
      in: query
      name: token
      type: apiKey
  schemas:
    api.ChannelTag:
      description: Channel or tag name
      properties:
        name:
          description: Name of the channel or tag
          example: Technology
          type: string
      type: object
    api.Image:
      description: Article image with size and URL
      properties:
        alt:
          description: Alternative text describing the image for accessibility
          example: Apple logo on a storefront
          type: string
        size:
          description: Image size (thumb, small, large)
          example: large
          type: string
        url:
          description: URL of the image
          example: https://cdn.benzinga.com/files/images/story/2024/example.jpg
          type: string
      type: object
    api.NewsItem:
      description: News article item with full metadata
      properties:
        author:
          description: The author of the article. This could be a Benzinga journalist,
            news desk analyst or contributor on benzinga.com
          example: Benzinga Newsdesk
          type: string
        body:
          description: The article content. This field can contain HTML and HTML encoded
            characters
          type: string
        channels:
          description: >-
            The topic(s) or categories that relate to the article. Channels can
            have sub-channels, but they will all be listed

            as their own item. For Why is it Moving (WIIM) data, use 'WIIM' as channel
          items:
            $ref: "#/components/schemas/api.ChannelTag"
          type: array
        created:
          description: >-
            The moment the article is created. The time zone is GMT-4 (EDT).
            This timestamp will not change. Format: RFC 2822 /

            RFC 1123
          example: Wed, 17 May 2017 14:20:15 -0400
          type: string
        id:
          description: The unique identifier of the article. This identifier is also found
            in the path of url on benzinga.com
          example: 123456
          type: integer
        image:
          description: The featured image related to the article, if applicable. Benzinga
            Pro headlines will not contain a featured image
          items:
            $ref: "#/components/schemas/api.Image"
          type: array
        importance_rank:
          description: The importance rank of the article on a scale of 1 (Low) to 5
            (High). Defaults to 1 when not set
          example: 1
          type: integer
        original_id:
          description: Original article ID if this is a referenced or related article
          type: integer
        stocks:
          description: >-
            The stock symbols that are listed within the article body. This will
            not display competitor symbols unless they are

            specifically referenced in the article
          items:
            $ref: "#/components/schemas/api.Stock"
          type: array
        tags:
          description: >-
            Additional tags that are not channels or categories, but are
            recurring themes including analyst names, bills,

            products, politicians, celebrities, stock movements
          items:
            $ref: "#/components/schemas/api.ChannelTag"
          type: array
        teaser:
          description: >-
            Depending on content source: for full articles, this is the first
            sentence up to 256 characters; for Pro headlines,

            provides additional context. This field can contain HTML and HTML encoded characters
          type: string
        title:
          description: The headline of the article. This will only be plain text
          example: Apple Announces New iPhone
          type: string
        updated:
          description: >-
            The timestamp of the last update to the article. The time zone is
            GMT-4 (EDT). This timestamp has the ability to

            change one or many times. Format: RFC 2822 / RFC 1123
          example: Wed, 17 May 2017 14:20:15 -0400
          type: string
        url:
          description: The url where the article lives on benzinga.com
          example: https://www.benzinga.com/news/123456
          type: string
      type: object
    api.NewsRemovedItem:
      description: Removed news article with ID and update timestamp
      properties:
        id:
          description: ID of removed news content
          example: 123456
          type: integer
        updated:
          description: "The timestamp of when the article was removed. Format: RFC 2822 /
            RFC 1123"
          example: Wed, 17 May 2017 14:20:15 -0400
          type: string
      type: object
    api.Stock:
      description: Stock information with ticker symbol and identifiers
      properties:
        cusip:
          description: CUSIP identifier (requires license agreement)
          example: "037833100"
          type: string
        exchange:
          description: Exchange where the stock is traded
          example: NASDAQ
          type: string
        gics:
          description: GICS industry classification
          example: Semiconductors & Semiconductor Equipment
          type: string
        gics_code:
          description: GICS industry classification code
          example: "45301020"
          type: string
        isin:
          description: ISIN identifier
          example: US0378331005
          type: string
        name:
          description: Stock ticker symbol
          example: AAPL
          type: string
        sector:
          description: Market sector classification
          example: Equity
          type: string
      type: object

  /api/v1/sec/insider_transactions/{view_type}:
    get:
      description: Returns insider transaction data from SEC Form 4 filings. Use /filings
        endpoint for grouped filing view (transactions nested under each filing) or
        /transactions endpoint for flattened individual transaction view. Both endpoints
        support the same query parameters.
      operationId: get-insider-transaction
      parameters:
        - description: Page offset. For optimization, performance and technical reasons,
            page offsets are limited from 0 - 100000. Limit the query results by other
            parameters such as date. Default is 0
          in: query
          name: page
          schema:
            type: integer
            default: 0
        - description: Number of results returned. Limit 1000
          in: query
          name: pagesize
          schema:
            type: integer
            default: 100
        - description: Start date in YYYY-MM-DD format
          in: query
          name: date_from
          schema:
            type: string
            format: date
        - description: End date in YYYY-MM-DD format
          in: query
          name: date_to
          schema:
            type: string
            format: date
        - description: Records last Updated Unix timestamp (UTC). This will force
            the sort order to be Greater Than or Equal to the timestamp indicated
          in: query
          name: updated_since
          schema:
            type: integer
        - description: Date in YYYY-MM-DD format
          in: query
          name: date
          schema:
            type: string
            format: date
        - description: Chamber
          in: query
          name: chamber
          schema:
            type: string
            enum:
              - House
              - Senate
        - description: Fields
          in: query
          name: fields
          schema:
            type: string
        - description: Search keys type
          in: query
          name: search_keys_type
          schema:
            type: string
            enum:
              - symbol
              - accession_number
              - cik
              - id
        - description: Search keys
          in: query
          name: search_keys
          schema:
            type: string
        - description: Display
          in: query
          name: display
          schema:
            type: string
            enum:
              - flat
              - nested
        - description: 'Response format: ''filings'' returns grouped filing view with
            transactions nested, ''transactions'' returns flattened individual transaction
            view'
          in: path
          name: view_type
          required: true
          schema:
            type: string
            enum:
              - filings
              - transactions
      responses:
        '200':
          description: 'Insider Transaction data. Response structure varies by endpoint:
            /filings returns nested filing data, /transactions returns flattened transaction
            data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitlab_benzinga_io_benzinga_bzgo_pkg_models_calendar-api.InsiderTransactionFilingDoc'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
      security:
        - ApiKeyAuth: []
      summary: Insider Transactions
      tags:
        - Insider Transaction
